<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- meta:start -->
  <title data-i18n="Armourer — Valheim Companion">Armourer — Valheim Companion</title>
  <meta name="description" content="Every Valheim armor set by biome. Pick pieces and upgrade levels and get the full material list — and where to farm it.">
  <link rel="canonical" href="https://valheim-companion.teuferon.click/armourer/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Valheim Companion">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Armourer — Valheim Companion">
  <meta property="og:description" content="Every Valheim armor set by biome. Pick pieces and upgrade levels and get the full material list — and where to farm it.">
  <meta property="og:url" content="https://valheim-companion.teuferon.click/armourer/">
  <meta property="og:image" content="https://valheim-companion.teuferon.click/og/armourer.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Armourer — Valheim Companion">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Armourer — Valheim Companion">
  <meta name="twitter:description" content="Every Valheim armor set by biome. Pick pieces and upgrade levels and get the full material list — and where to farm it.">
  <meta name="twitter:image" content="https://valheim-companion.teuferon.click/og/armourer.png">
  <meta name="theme-color" content="#0f1216">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="vc-ga" content="G-CXQVNCCJKE">
  <meta name="vc-site" content="https://valheim-companion.teuferon.click">
  <script src="/shared/analytics/consent.js" defer></script>
  <!-- meta:end -->
  <link rel="stylesheet" href="assets/styles.css">
  <script src="../../shared/i18n/languages.js"></script>
  <script src="../../shared/i18n/core.js"></script>
  <script src="assets/messages.js"></script>
  <script src="data/data.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <div id="language-picker" class="language-picker"></div>
      <nav class="hub-nav" aria-label="Navigation" data-i18n-attr="aria-label:Navigation">
        <a href="../" data-i18n="← Valheim Companion">← Valheim Companion</a>
      </nav>
      <div class="header-main">
        <h1 class="header-title" data-i18n="Armourer">Armourer</h1>
        <p class="header-subtitle" data-i18n="Every armor set, what it costs and where to find the materials.">Every armor set, what it costs and where to find the materials.</p>
      </div>

      <div class="header-controls" role="region" aria-label="Controls" data-i18n-attr="aria-label:Controls">
        <div class="controls-toggles">
          <label class="toggle-control" id="toggle-spoilers-label">
            <input type="checkbox" id="toggle-spoilers">
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">Show all (spoilers)</span>
          </label>
        </div>

        <div class="controls-actions">
          <button type="button" id="btn-collapse-all" class="action-btn" data-i18n="Collapse all">Collapse all</button>
          <button type="button" id="btn-reset-progress" class="action-btn action-btn-danger" data-i18n="Reset spoiler progress">Reset spoiler progress</button>
        </div>
      </div>
    </header>

    <div class="armourer-layout">
      <main class="armourer-catalog" aria-label="Catalog" data-i18n-attr="aria-label:Catalog">
        <div id="catalog-tabs" class="catalog-tabs" role="tablist" aria-label="Catalog sections" data-i18n-attr="aria-label:Catalog sections">
          <button type="button" role="tab" id="tab-armor" class="catalog-tab-btn active" aria-selected="true" aria-controls="catalog-armor-view" data-i18n="Armor Sets">Armor Sets</button>
          <button type="button" role="tab" id="tab-weapons" class="catalog-tab-btn" aria-selected="false" aria-controls="catalog-weapons-view" data-i18n="Weapons & Shields">Weapons & Shields</button>
        </div>
        <div id="catalog-armor-view" class="catalog-view active" role="tabpanel" aria-labelledby="tab-armor">
          <div id="biomes-container" class="biomes-container"></div>
          <div id="cosmetics-container" class="cosmetics-container"></div>
        </div>
        <div id="catalog-weapons-view" class="catalog-view" role="tabpanel" aria-labelledby="tab-weapons" hidden>
          <div id="weapons-biomes-container" class="biomes-container"></div>
        </div>
      </main>

      <!-- Shopping cart panel: sticky on desktop, sliding drawer on mobile -->
      <aside id="cart-panel" class="cart-panel" aria-label="Shopping list" data-i18n-attr="aria-label:Shopping list">
        <div class="cart-header">
          <div class="cart-header-title-row">
            <h2 class="cart-title" data-i18n="Shopping List">Shopping List</h2>
            <span id="cart-count-badge" class="badge badge-count">0 items</span>
          </div>
          <button type="button" id="btn-cart-mobile-close" class="cart-mobile-close-btn" aria-label="Close shopping list" data-i18n-attr="aria-label:Close shopping list">✕</button>
        </div>

        <div id="cart-content" class="cart-content">
          <!-- Cart items and breakdown rendered by app.js -->
        </div>
      </aside>
    </div>

    <footer id="page-footer" class="page-footer"></footer>
  </div>

  <!-- Mobile floating bar to toggle the shopping cart drawer -->
  <div id="mobile-cart-bar" class="mobile-cart-bar" aria-hidden="true">
    <button type="button" id="btn-mobile-cart-toggle" class="mobile-cart-btn">
      <span class="mobile-cart-icon">🛒</span>
      <span class="mobile-cart-text" data-i18n="Shopping List">Shopping List</span>
      <span id="mobile-cart-badge" class="badge badge-count">0</span>
    </button>
  </div>
</body>
</html>
