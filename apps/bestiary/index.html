<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestiary — Valheim Companion</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="data/data.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <nav class="hub-nav" aria-label="Navigation">
        <a href="../">← Valheim Companion</a>
      </nav>
      <div class="header-main">
        <h1 class="header-title">Bestiary</h1>
        <p class="header-subtitle">Creatures, bosses, weaknesses &amp; the best weapons — biome by biome, spoiler-free.</p>
      </div>

      <div class="header-controls" role="region" aria-label="Controls">
        <div class="controls-search-kind">
          <div class="search-box">
            <input type="search" id="creature-search" placeholder="Search open biomes…" aria-label="Search creatures in open biomes">
          </div>
          <div class="kind-filter" role="group" aria-label="Filter creatures by kind">
            <button type="button" class="filter-btn active" data-kind="all">All</button>
            <button type="button" class="filter-btn" data-kind="boss">Bosses</button>
            <button type="button" class="filter-btn" data-kind="hostile">Hostile</button>
            <button type="button" class="filter-btn" data-kind="passive">Passive</button>
            <button type="button" class="filter-btn" data-kind="fish">Fish</button>
          </div>
        </div>

        <div class="controls-actions">
          <button type="button" id="btn-collapse-all" class="action-btn">Collapse all</button>
          <button type="button" id="btn-reset-progress" class="action-btn action-btn-danger">Reset spoiler progress</button>
        </div>
      </div>
    </header>

    <section id="legend-section" class="legend-section" aria-label="Game Legend"></section>

    <main id="biomes-container" class="biomes-container" aria-label="Biomes"></main>

    <footer id="page-footer" class="page-footer"></footer>
  </div>

  <dialog id="weapon-modal" class="weapon-modal" aria-labelledby="modal-weapon-title">
    <div class="modal-content" id="weapon-modal-content"></div>
  </dialog>
</body>
</html>
