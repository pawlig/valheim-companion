server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /bestiary {
        return 301 /bestiary/;
    }

    location = /armourer {
        return 301 /smithy/$is_args$args;
    }

    location ^~ /armourer/ {
        rewrite ^/armourer/(.*)$ /smithy/$1 permanent;
    }

    location = /smithy {
        return 301 /smithy/$is_args$args;
    }

    location = /progress {
        return 301 /progress/$is_args$args;
    }

    location = /provisions {
        return 301 /provisions/$is_args$args;
    }

    location = /comfort {
        return 301 /comfort/$is_args$args;
    }

    location = /expedition {
        return 301 /expedition/$is_args$args;
    }

    location = /items {
        return 301 /items/$is_args$args;
    }

    location /items/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location = /signs {
        return 301 /signs/;
    }

    location = /damage-calculator {
        return 301 /damage-calculator/;
    }

    # Hashed Vite assets for the SPA sections: cache forever, ^~ prevents regex
    # override
    location ^~ /signs/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /damage-calculator/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /bestiary/img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /smithy/img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /provisions/img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /comfort/img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /damage-calculator/items/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Unhashed file names: the browser revalidates via ETag on every load.
    location ~* \.(?:html|js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /signs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /signs/index.html;
    }

    location /damage-calculator/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /damage-calculator/index.html;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
